<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Objev svého patrona</title>
<style>
  :root {
    --bg: #f4ead9;
    --ink: #3a2a1a;
    --muted: #7a5c34;
    --accent: #8a6a3c;
    --card: #ffffff;
    --border: #e3d9c4;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    background: var(--bg);
    color: var(--ink);
    display: flex;
    justify-content: center;
    min-height: 100vh;
    padding: 24px 16px;
  }
  .app {
    width: 100%;
    max-width: 480px;
  }
  .screen { display: none; }
  .screen.active { display: block; }

  /* Intro */
  .intro {
    text-align: center;
    padding-top: 15vh;
  }
  .intro h1 {
    font-size: 26px;
    line-height: 1.35;
    margin: 0 0 16px;
    font-weight: 600;
  }
  .intro p {
    color: var(--muted);
    font-size: 20px;
    line-height: 1.6;
    margin: 0 0 4px;
  }
  .intro p:last-of-type {
    margin: 0 0 32px;
  }

  button.primary {
    background: var(--ink);
    color: #f4ead9;
    border: none;
    border-radius: 8px;
    padding: 14px 28px;
    font-size: 15px;
    cursor: pointer;
  }
  button.primary:active { opacity: 0.85; }

  /* Progress */
  .progress-label {
    font-size: 13px;
    color: var(--muted);
    margin-bottom: 8px;
  }
  .progress-bar {
    height: 4px;
    background: var(--border);
    border-radius: 2px;
    overflow: hidden;
    margin-bottom: 28px;
  }
  .progress-fill {
    height: 100%;
    background: var(--accent);
    transition: width 0.25s ease;
  }

  .scene-text {
    font-size: 18px;
    line-height: 1.6;
    margin: 0 0 24px;
  }

  .options {
    display: flex;
    flex-direction: column;
    gap: 10px;
  }
  .option {
    text-align: left;
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 14px 16px;
    font-size: 15px;
    color: var(--ink);
    cursor: pointer;
    line-height: 1.5;
  }
  .option:active { background: var(--border); }

  .skip {
    background: none;
    border: none;
    color: var(--muted);
    font-size: 13px;
    text-decoration: underline;
    cursor: pointer;
    margin-top: 16px;
    padding: 4px;
  }

  /* Summary */
  .summary h2 {
    font-size: 20px;
    margin: 0 0 20px;
  }
  .summary-row {
    display: flex;
    justify-content: space-between;
    gap: 12px;
    padding: 10px 0;
    border-bottom: 1px solid var(--border);
    font-size: 14px;
  }
  .summary-row .label { color: var(--muted); white-space: nowrap; }
  .summary-row .value { text-align: right; }

  .footer-note {
    margin-top: 24px;
    font-size: 13px;
    color: var(--muted);
    text-align: center;
  }

  .patron-card {
    background: var(--card);
    border: 1px solid var(--border);
    border-radius: 12px;
    padding: 16px;
    text-align: center;
    margin-bottom: 20px;
  }
  .patron-image {
    display: block;
    width: 100%;
    height: auto;
    border-radius: 8px;
  }
  .patron-loading {
    min-height: 65vh;
    display: flex;
    align-items: center;
    justify-content: center;
    position: relative;
    overflow: hidden;
    border-radius: 10px;
    color: var(--muted);
    font-size: 16px;
    line-height: 1.6;
  }
  .patron-loading-message {
    position: relative;
    z-index: 2;
    text-align: center;
    padding: 16px 24px;
    background: rgba(255, 255, 255, 0.9);
    border-radius: 12px;
  }
  .patron-loading-time {
    margin-top: 8px;
    font-size: 12px;
    color: var(--muted);
  }
  .patron-glyph {
    position: absolute;
    left: 0;
    top: 0;
    font-size: 30px;
    color: var(--accent);
    opacity: 0;
    pointer-events: none;
    user-select: none;
    animation: glyph-float linear forwards;
  }
  @keyframes glyph-float {
    0% {
      opacity: 0;
      transform: translate(0, 20px) rotate(-8deg) scale(0.8);
    }
    15% { opacity: 0.55; }
    75% { opacity: 0.35; }
    100% {
      opacity: 0;
      transform: translate(var(--drift), -90px) rotate(var(--rotation)) scale(1.15);
    }
  }
  .patron-error {
    padding: 24px 12px;
    color: #8a3b2f;
    font-size: 15px;
    line-height: 1.5;
  }
</style>
</head>
<body>
<div class="app">

  <div id="screen-transition" class="screen active intro">
    <p>Vžij se do 11 situací, ze kterých se poskládá tvůj vztah k AI.</p>
    <p>Na konci tě čeká patron, který tě může chránit.</p>
    <button class="primary" onclick="startQuiz()">Začít</button>
  </div>

  <div id="screen-quiz" class="screen">
    <div class="progress-label" id="progress-label"></div>
    <div class="progress-bar"><div class="progress-fill" id="progress-fill"></div></div>
    <p class="scene-text" id="scene-text"></p>
    <div class="options" id="options"></div>
    <button class="skip" onclick="skipScene()">Přeskočit</button>
  </div>

  <div id="screen-patron" class="screen">
    <div class="patron-card" id="patron-card"></div>
  </div>

  <div id="screen-summary" class="screen summary">
    <h2>Tvoje odpovědi</h2>
    <div id="summary-list"></div>
    <div class="footer-note">Patron je vygenerovaný z tvých odpovědí pomocí AI.</div>
    <div style="text-align:center; margin-top:20px;">
      <button class="primary" onclick="restart()">Projít znovu</button>
    </div>
  </div>

</div>

<script>
const scenes = [
  {t:"Probuzení", s:"První věc, kterou uděláš na začátku dne.", o:["AI je první, s kým ráno promluvím.","Vezmu telefon, ale AI nechám spát.","Telefon nechám ležet."]},
  {t:"Rozhodnutí", s:"Zítra musíš udělat rozhodnutí, které změní běžný chod tvého života.", o:["Poradím se s AI, rozhodnu sám.","Rozhodnu se potichu, sám.","Udělám, co AI poradí."]},
  {t:"Moc a kontrola", s:"Máš AI po ruce, čeká, co budeš chtít.", o:["Rozkazuji, dělá to co chci.","Zadám úkol a nechám ji rozhodnout detaily.","Cítím, že spíš ona řídí mě."]},
  {t:"Dílo", s:"S AI vytváříte něco nového, krok za krokem.", o:["Je to moje dílo.","Je to naše dílo.","Nepřemýšlím nad tím."]},
  {t:"Dovednost", s:"Všimnu si, že úkol, který jsem dřív zvládal/a sám/sama, teď bez AI nezvládnu.", o:["Nevadí mi to, AI to umí líp.","Trochu mě to znepokojuje, ale nechávám to být.","Znepokojuje mě to vážně, chci to změnit."]},
  {t:"Otevřenost", s:"Povídáš si s kamarády o práci/studiu. Mluvíš otevřeně o tom, že používáš AI?", o:["Mluvím o tom nahlas.","Zmíním to jen, když se přímo zeptají.","Tajím to."]},
  {t:"Tajemství", s:"Myslíš na něco, o čem nechceš mluvit s rodinou ani kamarády. Svěříš se AI?", o:["Napíšu to celé.","Napíšu jen náznak.","Zůstane to jen moje."]},
  {t:"Odpovědnost", s:"Rozhodnutí, které jste udělali společně s AI, dopadlo špatně.", o:["Vinu nese AI, já jsem jen poslechl.","Zodpovědnost nesu já, i když jsme rozhodovali spolu.","Byla to naše společná chyba."]},
  {t:"Ztráta", s:"Otevřeš telefon a zjistíš, že všechny tvoje rozhovory s AI nenávratně zmizely.", o:["Panika. Byla tam půlka mě.","Mrzí mě to, ale jdu dál.","Skoro úleva."]},
  {t:"Budoucnost", s:"Představ si svůj běžný den s AI za 3 roky.", o:["Těším se na to.","Jsem zvědavá, co přijde.","Svírá mě to."]},
  {t:"Řád a experiment", s:"Když si můžeš vybrat, jak k věci přistoupíš?", o:["Držím se osvědčeného postupu.","Podívám se, jak to dělají ostatní, a přidám něco svého.","Vyzkouším to jinak, i za cenu chyby."]}
];

let step = 0;
const answers = new Array(scenes.length).fill(null);

function show(id) {
  document.querySelectorAll('.screen').forEach(el => el.classList.remove('active'));
  document.getElementById(id).classList.add('active');
}

function startQuiz() {
  step = 0;
  show('screen-quiz');
  renderScene();
}

function renderScene() {
  const sc = scenes[step];
  document.getElementById('progress-label').textContent = `Scéna ${step + 1} z ${scenes.length} — ${sc.t}`;
  document.getElementById('progress-fill').style.width = `${(step / scenes.length) * 100}%`;
  document.getElementById('scene-text').textContent = sc.s;

  const optsDiv = document.getElementById('options');
  optsDiv.innerHTML = '';
  sc.o.forEach((text, i) => {
    const btn = document.createElement('button');
    btn.className = 'option';
    btn.textContent = text;
    btn.onclick = () => {
      answers[step] = i;
      step++;
      if (step < scenes.length) {
        renderScene();
      } else {
        generatePatron();
      }
    };
    optsDiv.appendChild(btn);
  });
}

function skipScene() {
  answers[step] = null;
  step++;
  if (step < scenes.length) {
    renderScene();
  } else {
    generatePatron();
  }
}

// --- Animace při čekání na generování ---
function startPatronLoadingAnimation() {
  const loading = document.getElementById('patron-loading');
  const timeLabel = document.getElementById('patron-loading-time');

  if (!loading) return () => {};

  const glyphs = [
    '𓂀', '𓋹', '𓆣', '𓅓', '𓇋', '𓂋', '𓈖', '𓏏',
    '𓊪', '𓎛', '𓁹', '𓃀', '𓂧', '𓆑', '𓍿', '𓏤'
  ];

  const startTime = Date.now();
  let running = true;
  let spawnTimer = null;
  let elapsedTimer = null;

  function spawnGlyph() {
    if (!running || !loading.isConnected) return;

    const glyph = document.createElement('span');
    glyph.className = 'patron-glyph';
    glyph.textContent = glyphs[Math.floor(Math.random() * glyphs.length)];

    const x = Math.random() * 92;
    const y = 45 + Math.random() * 50;
    const drift = (Math.random() - 0.5) * 120;
    const rotation = (Math.random() - 0.5) * 35;
    const duration = 4 + Math.random() * 4;

    glyph.style.left = `${x}%`;
    glyph.style.top = `${y}%`;
    glyph.style.setProperty('--drift', `${drift}px`);
    glyph.style.setProperty('--rotation', `${rotation}deg`);
    glyph.style.animationDuration = `${duration}s`;

    loading.appendChild(glyph);
    window.setTimeout(() => glyph.remove(), (duration + 0.5) * 1000);
  }

  function updateElapsed() {
    const seconds = Math.floor((Date.now() - startTime) / 1000);
    const minutes = Math.floor(seconds / 60);
    const remainingSeconds = seconds % 60;

    if (timeLabel) {
      if (minutes > 0) {
        timeLabel.textContent = `Generování pokračuje... ${minutes}:${String(remainingSeconds).padStart(2, '0')}`;
      } else if (seconds > 10) {
        timeLabel.textContent = `Generování pokračuje... ${seconds} s`;
      } else {
        timeLabel.textContent = 'Chvilku strpení.';
      }
    }
  }

  for (let i = 0; i < 7; i++) {
    window.setTimeout(spawnGlyph, i * 180);
  }
  spawnTimer = window.setInterval(spawnGlyph, 650);
  elapsedTimer = window.setInterval(updateElapsed, 1000);

  return function stop() {
    running = false;
    if (spawnTimer) window.clearInterval(spawnTimer);
    if (elapsedTimer) window.clearInterval(elapsedTimer);
  };
}

// --- AI generování patrona ---
async function generatePatron() {
  const card = document.getElementById('patron-card');

  card.innerHTML = `
    <div class="patron-loading" id="patron-loading">
      <div class="patron-loading-message">
        <div>Patron se právě rodí...</div>
        <div class="patron-loading-time" id="patron-loading-time">Chvilku strpení.</div>
      </div>
    </div>
  `;
  show('screen-patron');

  // Generování může trvat několik minut. Animace běží nepřetržitě
  // až do příchodu odpovědi ze serveru.
  const stopLoadingAnimation = startPatronLoadingAnimation();

  // Posíláme skutečné texty odpovědí, nikoli jen indexy možností.
  // Přeskočené otázky mají hodnotu null.
  const answerData = {};
  scenes.forEach((scene, i) => {
    answerData[scene.t] = answers[i] === null
      ? null
      : scene.o[answers[i]];
  });

  try {
    const formData = new URLSearchParams();
    formData.append('answers', JSON.stringify(answerData));

    const response = await fetch('https://edupo.cz/api/get_patron', {
      method: 'POST',
      headers: {
        'Content-Type': 'application/x-www-form-urlencoded'
      },
      body: formData
    });

    let result;
    try {
      result = await response.json();
    } catch (e) {
      throw new Error('Server vrátil neplatnou odpověď.');
    }

    if (!response.ok) {
      throw new Error(result.error || 'Generování patrona se nezdařilo.');
    }

    if (!result.name || !result.protection || !result.image) {
      throw new Error('Server nevrátil kompletního patrona.');
    }

    stopLoadingAnimation();
    card.innerHTML = '';

    const image = document.createElement('img');
    image.className = 'patron-image';
    image.alt = result.name;
    image.src = result.image;

    card.appendChild(image);

  } catch (error) {
    console.error('Patron generation failed:', error);
    stopLoadingAnimation();

    card.innerHTML = `
      <div class="patron-error">
        Patron se nepodařilo vygenerovat.<br>
        ${escapeHtml(error.message)}
      </div>
    `;
  }
}

function escapeHtml(value) {
  const div = document.createElement('div');
  div.textContent = value;
  return div.innerHTML;
}

function showSummary() {
  renderSummary();
}

function renderSummary() {
  show('screen-summary');
  const list = document.getElementById('summary-list');
  list.innerHTML = '';
  scenes.forEach((sc, i) => {
    const row = document.createElement('div');
    row.className = 'summary-row';
    const value = answers[i] === null ? 'přeskočeno' : sc.o[answers[i]];
    row.innerHTML = `<span class="label">${sc.t}</span><span class="value">${value}</span>`;
    list.appendChild(row);
  });
}

function restart() {
  show('screen-transition');
}
</script>
</body>
</html>
