    <form method="get" action="{{ url_for('call_search') }}">
        <input name="query" value="{{ query }}">
        <input type="checkbox" name="use_regex" value="true" {% if use_regex %}checked{% endif %}> regex
        <input type="checkbox" name="target" value="json" {% if search_json %}checked{% endif %}> hledat v JSONu (včetně anotací)
        {% if per_page %}<input type="hidden" name="per_page" value="{{ per_page }}">{% endif %}
        <input type="submit" value="Vyhledat" title="Vyhledat"
        onclick="this.value='Vyhledávám...'; this.disabled = true; this.form.submit();">
    </form>
