<!DOCTYPE html>
<html lang="cs">
<head>
    <meta charset="utf-8">
    <title>EduPo</title>
    <link rel="icon" type="image/x-icon" href="{{ url_for('static', filename='favicon.ico') }}">
</head>
<body>

<h1>EduPo</h1>

<h2>Zobrazit vygenerovanou báseň</h2>

<ul>
{% for poem in poems %}
    <li>
        <a href="{{ url_for('call_show', poemid=poem.id) }}">{{ poem.id }}</a>
        {% if poem.preview %}<span style="color: #666">&mdash; {{ poem.preview }}</span>{% endif %}
    </li>
{% endfor %}
</ul>

</body>
</html>
