<p id="post-share">

    <script>
        async function shareImage() {
        try {
            await navigator.share({
            title: "Moje tvorba z výstavy #JiriWolkerMGP",
            text: "Podívejte se, co mi vygenerovala AI s Jiřím Wolkerem na výstavě #JiriWolkerMGP",
            url: window.location.href
            });
        } catch (e) {
            console.log("Sdílení zrušeno nebo není podporováno.");
        }
        }
    </script>

    <p>
        Děkujeme! Tvoje tvorba je nyní součástí výstavy #JiriWolkerMGP. Můžeš ji také sdílet pod svým účtem na sociálních sítích nebo poslat odkaz kamarádům.

    <form onsubmit="event.preventDefault(); shareImage()" class="standard">

</p>
