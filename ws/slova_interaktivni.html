<!doctype html>
<html lang="cs">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Slova</title>
<style>
* { box-sizing: border-box; }
html, body {
  margin: 0; padding: 0; width: 100%; height: 100%;
  overflow: hidden; background: #fff;
}
body {
  font-family: Arial, Helvetica, sans-serif;
  touch-action: none;
  user-select: none;
  -webkit-user-select: none;
  -webkit-touch-callout: none;
}
#stage {
  position: relative;
  width: 100vw;
  height: 100dvh;
  overflow: hidden;
  background: #fff;
}
.word {
  position: absolute;
  display: block;
  white-space: nowrap;
  color: #111;
  font-size: clamp(18px, 3.2vw, 30px);
  line-height: 1.2;
  font-weight: 400;
  cursor: grab;
  padding: 3px 5px;
  touch-action: none;
  will-change: left, top;
}
.word.dragging { cursor: grabbing; z-index: 1000; }
#coordinate-grid {
  position: absolute;
  inset: 0;
  width: 100%;
  height: 100%;
  pointer-events: none;
}
#coordinate-grid[hidden] { display: none; }
.word { z-index: 1; }
.coordinates {
  display: none;
  position: absolute;
  top: 100%;
  left: 50%;
  transform: translateX(-50%);
  font-size: 12px;
  line-height: 1.2;
  color: #777;
  pointer-events: none;
}
.show-coordinates .coordinates { display: block; }
#coordinate-toggle {
  position: absolute;
  left: 50%;
  top: 50%;
  transform: translate(-50%, -50%);
  width: 40px;
  height: 40px;
  padding: 0;
  border: 0;
  border-radius: 50%;
  background: transparent;
  color: #555;
  cursor: pointer;
  z-index: 1001;
  touch-action: manipulation;
}
#coordinate-toggle svg { display: block; width: 100%; height: 100%; }
#coordinate-toggle:hover { color: #111; }
#coordinate-toggle:focus-visible { outline: 2px solid #555; outline-offset: 2px; }
@media (max-width: 600px) {
  .word { font-size: clamp(18px, 5.2vw, 24px); }
}
</style>
</head>
<body>
<main id="stage" aria-label="Slova">
  <svg id="coordinate-grid" aria-hidden="true" hidden></svg>
  <button id="coordinate-toggle" type="button" aria-label="Zobrazit souřadnice" aria-pressed="false" title="Zobrazit souřadnice">
    <svg viewBox="0 0 40 40" aria-hidden="true">
      <circle cx="20" cy="20" r="10" fill="white" fill-opacity="0.8" stroke="currentColor" stroke-width="1.5" />
      <path d="M20 3v12m0 10v12M3 20h12m10 0h12" fill="none" stroke="currentColor" stroke-width="1.5" />
      <circle cx="20" cy="20" r="2" fill="currentColor" />
    </svg>
  </button>
</main>
<script>
(() => {
  "use strict";
  const WORDS = ["pes","mravenec","kůň","kráva","veverka","moucha","maso","mléko","sýr","jablko","ryba","ponožka","kuchař","mech","řidič","učitel","prsten","auto","letadlo","kolo","vlak","děti","list","škola","obchod","farma","svetr","knoflík","koberec","louka","silnice","hřiště","les","park","řeka"];
  const MOBILE_LIMIT = 600;
  const MOBILE_WORD_COUNT = 13;
  const MIN_GAP = 8;
  const stage = document.getElementById("stage");
  const grid = document.getElementById("coordinate-grid");
  const toggle = document.getElementById("coordinate-toggle");
  let coordinatesVisible = false;
  let active = null;
  let resizeTimer = null;

  function gridUnit() {
    return Math.min(stage.clientWidth, stage.clientHeight) / 9;
  }

  function updateCoordinates(el) {
    const x = (parseFloat(el.style.left) + el.offsetWidth / 2 - stage.clientWidth / 2) / gridUnit();
    const y = (stage.clientHeight / 2 - parseFloat(el.style.top) - el.offsetHeight / 2) / gridUnit();
    const format = value => (Math.abs(value) < 0.05 ? 0 : value).toFixed(1).replace(".", ",");
    el.querySelector(".coordinates").textContent = `[${format(x)}; ${format(y)}]`;
  }

  function drawGrid() {
    grid.replaceChildren();
    const width = stage.clientWidth, height = stage.clientHeight;
    const unit = gridUnit();
    if (!unit) return;
    function add(tag, attributes, text) {
      const el = document.createElementNS("http://www.w3.org/2000/svg", tag);
      for (const [key, value] of Object.entries(attributes)) el.setAttribute(key, value);
      if (text !== undefined) el.textContent = text;
      grid.appendChild(el);
    }
    for (const vertical of [true, false]) {
      const length = vertical ? width : height;
      const limit = Math.floor(length / (2 * unit));
      for (let n = -limit; n <= limit; n++) {
        const position = length / 2 + n * unit;
        add("line", {
          x1: vertical ? position : 0, y1: vertical ? 0 : position,
          x2: vertical ? position : width, y2: vertical ? height : position,
          stroke: n === 0 ? "#aaa" : "#e5e5e5", "stroke-width": n === 0 ? 1.5 : 1
        });
        if (n === 0 || position < 16 || position > length - 16) continue;
        add("text", {
          x: vertical ? position : width / 2 + 7,
          y: vertical ? height / 2 + 17 : position + 4,
          fill: "#888", "font-size": 12, "text-anchor": vertical ? "middle" : "start"
        }, vertical ? n : -n);
      }
    }
    add("text", { x: width / 2 + 23, y: height / 2 + 17, fill: "#888", "font-size": 12 }, "[0; 0]");
  }

  toggle.addEventListener("click", () => {
    coordinatesVisible = !coordinatesVisible;
    stage.classList.toggle("show-coordinates", coordinatesVisible);
    grid.toggleAttribute("hidden", !coordinatesVisible);
    toggle.setAttribute("aria-pressed", String(coordinatesVisible));
    const label = coordinatesVisible ? "Skrýt souřadnice" : "Zobrazit souřadnice";
    toggle.setAttribute("aria-label", label);
    toggle.title = label;
    if (coordinatesVisible) {
      drawGrid();
      stage.querySelectorAll(".word").forEach(updateCoordinates);
    }
  });

  function shuffled(items) {
    const a = items.slice();
    for (let i = a.length - 1; i > 0; i--) {
      const j = Math.floor(Math.random() * (i + 1));
      [a[i], a[j]] = [a[j], a[i]];
    }
    return a;
  }

  function getWordCount() {
    const w = window.innerWidth, h = window.innerHeight;
    if (Math.min(w, h) <= MOBILE_LIMIT) return Math.min(MOBILE_WORD_COUNT, WORDS.length);
    if (w <= 900) return Math.min(24, WORDS.length);
    return WORDS.length;
  }

  function rectsOverlap(a, b) {
    return !(
      a.right + MIN_GAP <= b.left ||
      a.left >= b.right + MIN_GAP ||
      a.bottom + MIN_GAP <= b.top ||
      a.top >= b.bottom + MIN_GAP
    );
  }

  function placeWords() {
    stage.querySelectorAll(".word").forEach(el => el.remove());
    active = null;
    const selected = shuffled(WORDS).slice(0, getWordCount());
    const placed = [{
      left: stage.clientWidth / 2 - 24, right: stage.clientWidth / 2 + 24,
      top: stage.clientHeight / 2 - 24, bottom: stage.clientHeight / 2 + 24
    }];

    for (const wordText of selected) {
      const el = document.createElement("div");
      el.className = "word";
      el.textContent = wordText;
      const coordinates = document.createElement("span");
      coordinates.className = "coordinates";
      el.appendChild(coordinates);
      stage.appendChild(el);

      const maxX = Math.max(0, stage.clientWidth - el.offsetWidth - 10);
      const maxY = Math.max(0, stage.clientHeight - el.offsetHeight - 10);
      let best = null;

      for (let attempt = 0; attempt < 80; attempt++) {
        const x = 5 + Math.random() * Math.max(0, maxX - 5);
        const y = 5 + Math.random() * Math.max(0, maxY - 5);
        const r = {
          left: x, top: y,
          right: x + el.offsetWidth,
          bottom: y + el.offsetHeight
        };
        if (!placed.some(other => rectsOverlap(r, other))) {
          best = r;
          break;
        }
        if (!best) best = r;
      }

      el.style.left = best.left + "px";
      el.style.top = best.top + "px";
      updateCoordinates(el);
      placed.push(best);
      el.addEventListener("pointerdown", startDrag);
    }
    if (coordinatesVisible) drawGrid();
  }

  function startDrag(e) {
    if (e.button !== undefined && e.button !== 0) return;
    const el = e.currentTarget;
    const stageRect = stage.getBoundingClientRect();
    const rect = el.getBoundingClientRect();

    active = {
      el,
      pointerId: e.pointerId,
      offsetX: e.clientX - rect.left,
      offsetY: e.clientY - rect.top,
      stageLeft: stageRect.left,
      stageTop: stageRect.top
    };

    el.classList.add("dragging");
    el.setPointerCapture?.(e.pointerId);
    e.preventDefault();
  }

  stage.addEventListener("pointermove", (e) => {
    if (!active || e.pointerId !== active.pointerId) return;
    const el = active.el;
    const maxX = Math.max(0, stage.clientWidth - el.offsetWidth);
    const maxY = Math.max(0, stage.clientHeight - el.offsetHeight);
    let x = e.clientX - active.stageLeft - active.offsetX;
    let y = e.clientY - active.stageTop - active.offsetY;
    x = Math.max(0, Math.min(maxX, x));
    y = Math.max(0, Math.min(maxY, y));
    el.style.left = x + "px";
    el.style.top = y + "px";
    if (coordinatesVisible) updateCoordinates(el);
    e.preventDefault();
  });

  function endDrag(e) {
    if (!active || e.pointerId !== active.pointerId) return;
    active.el.classList.remove("dragging");
    try { active.el.releasePointerCapture?.(e.pointerId); } catch (_) {}
    active = null;
  }

  stage.addEventListener("pointerup", endDrag);
  stage.addEventListener("pointercancel", endDrag);

  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(placeWords, 120);
  });

  placeWords();
})();
</script>
</body>
</html>
